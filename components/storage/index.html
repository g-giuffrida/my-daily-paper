<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const KEY='my-daily-paper:profile:v2';
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let restored=false;
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data.type!=='streamlit:render')return;
 const args=event.data.args;
 if(!restored){
  let profile={},warning='';
  try{profile=JSON.parse(localStorage.getItem(KEY)||'{}')}
  catch(e){warning='Browser storage is unavailable or invalid. Settings will last for this session only.'}
  restored=true;send('streamlit:setComponentValue',{value:{profile,warning},dataType:'json'});
 }
 if(args.profile){try{localStorage.setItem(KEY,JSON.stringify(args.profile))}
 catch(e){send('streamlit:setComponentValue',{value:{warning:'Browser storage is full or disabled. Your latest changes cannot be remembered after this session.'},dataType:'json'})}}
 send('streamlit:setFrameHeight',{height:0});
});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:0});
</script></body></html>
